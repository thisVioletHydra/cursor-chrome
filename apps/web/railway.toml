[build]
buildCommand = "pnpm install --frozen-lockfile && pnpm --filter @cursor-chrome/extension build && pnpm --filter @cursor-chrome/web build"

[deploy]
startCommand = "node apps/web/ext-link.mjs"
healthcheckPath = "/healthz"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
